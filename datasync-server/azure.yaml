# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: community-toolkit-datasync-server-aca
metadata:
  template: community-toolkit-datasync-server@8.0.0

infra:
  provider: bicep
  path: ./infra
  module: main-aca

workflows:
  up:
    steps:
      - azd: provision
      - azd: deploy --all

services:
  backend:
    project: ./src/Ben.Datasync.Server
    language: csharp
    host: containerapp
    docker:
      # The backend references the shared contracts project at repository root.
      path: ./datasync-server/Dockerfile
      context: ..
